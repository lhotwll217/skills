<!doctype html>
<html lang="en" data-theme="gray">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — Interactive diff review</title>
<style>
/* Luke's house theme — GitHub Primer dark-dimmed gunmetal, radius 0, mono headings */
:root, :root[data-theme="gray"] {
  color-scheme: dark;
  /* Battle-tested neutral hierarchy from GitHub Primer's dark-dimmed theme. */
  --background: #212830;
  --foreground: #d1d7e0;
  --card: #262c36;
  --card-foreground: #d1d7e0;
  --primary: #d1d7e0;
  --primary-foreground: #212830;
  --secondary: #2a313c;
  --secondary-foreground: #d1d7e0;
  --muted: #262c36;
  --muted-foreground: #9198a1;
  --accent: #2f3742;
  --accent-foreground: #f0f6fc;
  --destructive: #e5534b;
  --positive: #57ab5a;
  --border: #3d444d;
  --input: #3d444d;
  --ring: #656c76;
  --chart-1: #2a313c;
  --chart-2: #3d444d;
  --chart-3: #656c76;
  --chart-4: #9198a1;
  --chart-5: #d1d7e0;
  /* Owner Operator terminal semantics for workflows and system diagrams. */
  --terminal-bronze: #b98a4b;
  --terminal-blue: #81a2be;
  --terminal-green: #b5bd68;
  --terminal-red: #cc6666;
  --terminal-yellow: #e0af68;
  --terminal-purple: #b294bb;
  --terminal-teal: #4EC9B0;
  --radius: 0;
  --font-sans: Inter, "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --font-heading: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; border-color: var(--border); }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, .num { font-family: var(--font-heading); font-weight: 700; letter-spacing: -0.02em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.125rem; }
h3 { font-size: 1rem; }

/* Cards: 1px border, no shadow, no radius */
.card {
  background: var(--card);
  color: var(--card-foreground);
  border: 1px solid var(--border);
  padding: 1.25rem;
}
.card-title { font-family: var(--font-heading); font-weight: 700; font-size: 0.95rem; margin: 0 0 0.25rem; }
.card-sub { color: var(--muted-foreground); font-size: 0.8rem; margin: 0 0 1rem; }

/* Uppercase micro-label ("RETIREMENT", "AUTO-SAVE PLAN") */
.label {
  font-family: var(--font-heading);
  font-size: 0.6875rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted-foreground);
}

/* Big mono figure ("$420,000") */
.stat { font-family: var(--font-heading); font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }

.btn {
  display: inline-block;
  font-family: var(--font-heading);
  font-size: 0.8125rem;
  font-weight: 500;
  padding: 0.55rem 1rem;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  text-align: center;
}
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-outline { background: transparent; color: var(--foreground); border-color: var(--border); }
.btn-block { display: block; width: 100%; }

.muted { color: var(--muted-foreground); }
.positive { color: var(--positive); }
.negative { color: var(--destructive); }

/* Thick flat progress bar */
.progress { height: 6px; background: var(--muted); }
.progress > div { height: 100%; background: var(--primary); }

input, textarea, select {
  font: inherit;
  color: var(--foreground);
  background: var(--background);
  border: 1px solid var(--input);
  border-radius: var(--radius);
  padding: 0.5rem 0.75rem;
  width: 100%;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--ring); outline-offset: 0; }

table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-family: var(--font-heading); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-foreground); }
th, td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
td.num, th.num { text-align: right; font-family: var(--font-heading); }

hr { border: 0; border-top: 1px solid var(--border); }
a { color: var(--foreground); }
code, pre { font-family: var(--font-heading); font-size: 0.85em; background: var(--muted); }
pre { padding: 0.75rem 1rem; overflow-x: auto; }
/* Prototype-specific layout, using theme variables only. */
body{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:var(--background);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.title{margin:0;font-size:15px}.meta{font-family:var(--font-heading);font-size:11px;color:var(--muted-foreground)}.prototype{color:var(--destructive)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 66px)}.main{padding:0 20px 20px;min-width:0}.sidebar{border-left:1px solid var(--border);padding:16px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}.file-nav{position:sticky;top:66px;z-index:15;display:flex;gap:0;overflow-x:auto;background:var(--background);border-bottom:1px solid var(--border);margin:0 -20px 20px;padding:10px 20px}.file-nav button{white-space:nowrap;border-right:0}.file-nav button:last-child{border-right:1px solid var(--border)}.file-review{scroll-margin-top:126px;margin-bottom:24px}.file-head{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-bottom:0;padding:10px 12px;font-family:var(--font-heading)}.diff{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);overflow:hidden}.side+.side{border-left:1px solid var(--border)}.side-title{padding:7px 10px;background:var(--muted);border-bottom:1px solid var(--border);font-family:var(--font-heading);font-size:11px}.line{display:grid;grid-template-columns:46px minmax(0,1fr);min-height:29px;border-bottom:1px solid var(--border)}.line:last-child{border-bottom:0}.line-no{padding:5px 8px;text-align:right;background:var(--muted);color:var(--muted-foreground);font:11px var(--font-heading);user-select:none}.code{padding:5px 10px;white-space:pre;overflow:hidden;text-overflow:ellipsis;font:12px/18px var(--font-heading);cursor:text}.line.add .code{background:color-mix(in oklch,var(--positive) 28%,var(--background));border-left:3px solid var(--positive)}.line.add .line-no{background:color-mix(in oklch,var(--positive) 18%,var(--muted));color:var(--positive)}.line.remove .code{background:color-mix(in oklch,var(--destructive) 26%,var(--background));border-left:3px solid var(--destructive)}.line.remove .line-no{background:color-mix(in oklch,var(--destructive) 16%,var(--muted));color:var(--destructive)}.line.annotated .code{outline:2px solid var(--terminal-bronze);outline-offset:-2px}.badge{float:right;background:var(--terminal-bronze);color:var(--primary-foreground);padding:0 5px;font-size:10px}.selection-help{padding:10px 12px;border:1px solid var(--border);border-top:0;color:var(--muted-foreground);font-size:12px}.composer{display:none;position:fixed;width:min(360px,calc(100vw - 24px));background:var(--card);border:1px solid var(--border);padding:12px;z-index:30}.composer.visible{display:block}.composer blockquote{margin:8px 0;padding:8px;border-left:3px solid var(--terminal-bronze);background:var(--muted);font:11px var(--font-heading);max-height:90px;overflow:auto}.composer textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.comment{border-top:1px solid var(--border);padding:12px 0;cursor:pointer}.comment:first-child{border-top:0}.comment:hover{background:var(--accent)}.quote{font:11px var(--font-heading);padding:6px;background:var(--muted);margin:6px 0;white-space:pre-wrap}.comment-actions{display:flex;gap:10px}.link-button{border:0;background:none;padding:0;color:var(--muted-foreground);font:11px var(--font-heading);text-decoration:underline;cursor:pointer}.save-status{font:11px var(--font-heading)}.empty{color:var(--muted-foreground);font-size:12px;padding:12px 0}::highlight(review-selection){background:var(--terminal-bronze);color:var(--primary-foreground)}@media(max-width:900px){.layout{display:block}.sidebar{position:static;height:auto;border-left:0;border-top:1px solid var(--border)}.diff{grid-template-columns:1fr}.side+.side{border-left:0;border-top:1px solid var(--border)}.topbar{align-items:flex-start}.meta{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div><div class="label prototype">Throwaway prototype</div><h1 class="title">src/catalog.ts · targeted review</h1></div>
  <div class="meta">34018237 → d33665cc · JSON: <span id="path"></span></div>
  <div class="save-status" id="save-status">Loading…</div>
</header>
<div class="layout">
  <main class="main">
    <nav class="file-nav" id="file-nav" aria-label="Changed files"></nav>
    <div id="files"></div>
    <div class="selection-help">Highlight changed text. The comment box opens beside the selection and autosaves when added.</div>
  </main>
  <aside class="sidebar">
    <section><div class="label">Comments · <span id="comment-count">0</span></div><div id="comments"></div></section>
  </aside>
</div>
<div class="composer" id="composer">
  <div class="label" id="composer-title">Comment on selection</div>
  <blockquote id="selected-quote"></blockquote>
  <textarea id="comment-text" placeholder="What should the AI understand or change?"></textarea>
  <div class="actions"><button class="btn btn-outline" id="cancel">Cancel</button><button class="btn btn-primary" id="save-comment">Add comment</button></div>
</div>
<script>
const reviewPath = __REVIEW_PATH_JSON__;
document.querySelector("#path").textContent = reviewPath;

const files = [
  {
    path: "src/catalog.ts", stats: "+4 −3", rows: [
      {old:44,new:44,kind:"same",left:"export function resolveCatalog(model: Model) {",right:"export function resolveCatalog(model: Model) {"},
      {old:45,new:null,kind:"remove",left:"  const scope = model.parentId ?? model.id",right:""},
      {old:46,new:null,kind:"remove",left:"  return findEntries(scope, model.kind)",right:""},
      {old:null,new:45,kind:"add",left:"",right:"  const scope = resolveInitiativeScope(model)"},
      {old:null,new:46,kind:"add",left:"",right:"  const entries = findEntries(scope, model.kind)"},
      {old:null,new:47,kind:"add",left:"",right:"  return entries.filter(entry => entry.visible)"},
      {old:47,new:48,kind:"same",left:"}",right:"}"},
    ],
  },
  {
    path: "src/scope.ts", stats: "+8 −0", rows: [
      {old:null,new:1,kind:"add",left:"",right:"import type { Model } from './types'"},
      {old:null,new:2,kind:"add",left:"",right:""},
      {old:null,new:3,kind:"add",left:"",right:"export function resolveInitiativeScope(model: Model) {"},
      {old:null,new:4,kind:"add",left:"",right:"  if (model.kind === 'initiative') return model.id"},
      {old:null,new:5,kind:"add",left:"",right:"  return model.parentId ?? model.id"},
      {old:null,new:6,kind:"add",left:"",right:"}"},
    ],
  },
  {
    path: "test/catalog.test.ts", stats: "+5 −1", rows: [
      {old:81,new:81,kind:"same",left:"it('filters hidden entries', () => {",right:"it('filters hidden entries', () => {"},
      {old:82,new:null,kind:"remove",left:"  expect(resolveCatalog(model)).toHaveLength(3)",right:""},
      {old:null,new:82,kind:"add",left:"",right:"  const result = resolveCatalog(model)"},
      {old:null,new:83,kind:"add",left:"",right:"  expect(result).toEqual([visibleEntry])"},
      {old:83,new:84,kind:"same",left:"})",right:"}"},
    ],
  },
];

let state;
let pendingSelection = null;
let editingCommentId = null;
const composer = document.querySelector("#composer");

function escapeHtml(value){const node=document.createElement("div");node.textContent=value;return node.innerHTML}
function statsHtml(stats){
  const [additions,deletions]=stats.split(" ");
  return `<span class="positive">${escapeHtml(additions)}</span> <span class="negative">${escapeHtml(deletions)}</span>`;
}
function lineId(file,side,line){return `line-${files.findIndex(item=>item.path===file)}-${side}-${line}`}
function fileId(index){return `file-${index}`}
function renderFileNavigation(){
  document.querySelector("#file-nav").innerHTML=files.map((file,index)=>`<button class="btn btn-outline" data-file-index="${index}">${escapeHtml(file.path)} <span class="muted">${statsHtml(file.stats)}</span></button>`).join("");
  document.querySelector(".title").textContent=`${files.length} files · targeted review`;
}
function renderDiff(){
  document.querySelector("#files").innerHTML=files.map((file,fileIndex)=>{
    const sides=["old","new"].map(side=>{
      const lines=file.rows.map(row=>{
        const line=side==="old"?row.old:row.new;
        const text=side==="old"?row.left:row.right;
        const relevantKind=line==null?"same":row.kind;
        const count=state?.comments.filter(c=>c.file===file.path&&c.side===side&&c.startLine<=line&&c.endLine>=line).length||0;
        return `<div class="line ${relevantKind} ${count?"annotated":""}" id="${line==null?"":lineId(file.path,side,line)}"><div class="line-no">${line??""}</div><div class="code" data-file="${escapeHtml(file.path)}" data-side="${side}" data-line="${line??""}">${escapeHtml(text)}${count?`<span class="badge">${count}</span>`:""}</div></div>`;
      }).join("");
      return `<section class="side"><div class="side-title">${side==="old"?"OLD · 34018237":"NEW · d33665cc"}</div>${lines}</section>`;
    }).join("");
    return `<section class="file-review" id="${fileId(fileIndex)}"><div class="file-head"><span>${escapeHtml(file.path)}</span><span>${statsHtml(file.stats)}</span></div><div class="diff">${sides}</div></section>`;
  }).join("");
}
function renderComments(){
  const comments=document.querySelector("#comments");
  comments.innerHTML=state.comments.length?state.comments.map(comment=>`<article class="comment" data-comment-id="${comment.id}" tabindex="0"><div class="label">${escapeHtml(comment.file)}:${comment.startLine}</div><div class="quote">${escapeHtml(comment.selectedText)}</div><div>${escapeHtml(comment.comment)}</div><div class="comment-actions"><button class="link-button" data-action="edit" data-id="${comment.id}">Edit</button><button class="link-button" data-action="delete" data-id="${comment.id}">Delete</button></div></article>`).join(""):`<div class="empty">No comments yet.</div>`;
  document.querySelector("#comment-count").textContent=state.comments.length;
}
function render(){renderFileNavigation();renderDiff();renderComments()}
async function save(){
  document.querySelector("#save-status").textContent="Saving…";
  const response=await fetch("/review.json",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(state)});
  document.querySelector("#save-status").textContent=response.ok?"Saved":"Save failed";
  render();
}
function closestCode(node){return node?.nodeType===Node.TEXT_NODE?node.parentElement?.closest(".code"):node?.closest?.(".code")}
function placeComposer(rect){
  document.body.append(composer);
  composer.classList.add("visible");
  document.querySelector("#selected-quote").textContent=pendingSelection.selectedText;
  const bounds=composer.getBoundingClientRect();
  const preferredLeft=rect.right+8;
  const left=preferredLeft+bounds.width<=innerWidth-12?preferredLeft:Math.max(12,rect.left-bounds.width-8);
  const preferredTop=rect.bottom+8;
  const top=preferredTop+bounds.height<=innerHeight-12?preferredTop:Math.max(12,rect.top-bounds.height-8);
  composer.style.left=`${left}px`;
  composer.style.top=`${top}px`;
  document.querySelector("#comment-text").focus();
}
function closeComposer(){
  composer.classList.remove("visible");
  CSS.highlights?.delete("review-selection");
  pendingSelection=null;
  editingCommentId=null;
  document.querySelector("#comment-text").value="";
  document.querySelector("#composer-title").textContent="Comment on selection";
  document.querySelector("#save-comment").textContent="Add comment";
}
function showFile(index){
  const section=document.getElementById(fileId(index));
  if(section)section.scrollIntoView({behavior:"smooth",block:"start"});
}
function openExistingComment(comment){
  const targetFileIndex=files.findIndex(file=>file.path===comment.file);
  if(targetFileIndex<0)return;
  const line=document.getElementById(lineId(comment.file,comment.side,comment.startLine));
  if(!line)return;
  line.scrollIntoView({behavior:"smooth",block:"center"});
  pendingSelection={...comment};
  editingCommentId=comment.id;
  document.querySelector("#comment-text").value=comment.comment;
  document.querySelector("#composer-title").textContent="Edit comment";
  document.querySelector("#save-comment").textContent="Save comment";
  requestAnimationFrame(()=>placeComposer(line.querySelector(".code").getBoundingClientRect()));
}

document.querySelector("#file-nav").onclick=event=>{
  const button=event.target.closest("button[data-file-index]");
  if(button)showFile(Number(button.dataset.fileIndex));
};
document.querySelector("#files").addEventListener("mouseup",async()=>{
  const selection=getSelection();
  const text=selection.toString().trim();
  if(!text)return;
  const start=closestCode(selection.anchorNode);
  const end=closestCode(selection.focusNode);
  if(!start||!end||start.dataset.side!==end.dataset.side||!start.dataset.line||!end.dataset.line)return;
  const range=selection.getRangeAt(0).cloneRange();
  if(CSS.highlights)CSS.highlights.set("review-selection",new Highlight(range));
  const lines=[Number(start.dataset.line),Number(end.dataset.line)].sort((a,b)=>a-b);
  const context=`${start.textContent}|${end.textContent}`;
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(context)))).map(v=>v.toString(16).padStart(2,"0")).join("");
  pendingSelection={file:start.dataset.file,side:start.dataset.side,startLine:lines[0],endLine:lines[1],selectedText:text,prefix:start.textContent.slice(0,40),suffix:end.textContent.slice(-40),contentHash:hash};
  editingCommentId=null;
  document.querySelector("#composer-title").textContent="Comment on selection";
  document.querySelector("#save-comment").textContent="Add comment";
  placeComposer(range.getBoundingClientRect());
});
document.querySelector("#cancel").onclick=closeComposer;
document.querySelector("#save-comment").onclick=async()=>{
  const comment=document.querySelector("#comment-text").value.trim();
  if(!pendingSelection||!comment)return;
  if(editingCommentId){
    const existing=state.comments.find(item=>item.id===editingCommentId);
    if(existing)existing.comment=comment;
  }else{
    state.comments.push({id:crypto.randomUUID(),...pendingSelection,comment});
  }
  closeComposer();
  await save();
};
document.querySelector("#comments").onclick=async event=>{
  const editButton=event.target.closest("button[data-action=edit]");
  if(editButton){
    event.stopPropagation();
    const comment=state.comments.find(item=>item.id===editButton.dataset.id);
    if(comment)openExistingComment(comment);
    return;
  }
  const deleteButton=event.target.closest("button[data-action=delete]");
  if(deleteButton){
    event.stopPropagation();
    state.comments=state.comments.filter(comment=>comment.id!==deleteButton.dataset.id);
    await save();
    return;
  }
  const card=event.target.closest(".comment[data-comment-id]");
  if(card){
    const comment=state.comments.find(item=>item.id===card.dataset.commentId);
    if(comment)openExistingComment(comment);
  }
};
document.querySelector("#comments").onkeydown=event=>{
  if(event.key!=="Enter"&&event.key!==" ")return;
  const card=event.target.closest(".comment[data-comment-id]");
  if(card){event.preventDefault();const comment=state.comments.find(item=>item.id===card.dataset.commentId);if(comment)openExistingComment(comment)}
};
fetch("/review.json").then(response=>response.json()).then(data=>{
  state=data;
  state.review.paths=files.map(file=>file.path);
  state.comments=state.comments.map(({status,...comment})=>comment);
  render();
  document.querySelector("#save-status").textContent="Saved";
});
</script>
</body>
</html>

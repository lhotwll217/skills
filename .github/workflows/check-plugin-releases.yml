name: Check plugin releases
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-plugin-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release guard
        run: python3 tests/check-plugin-releases/test_check.py
      - name: Check skill name prefixes
        run: python3 scripts/check-skill-names.py
      - name: Check published changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 scripts/check-plugin-releases.py --base "$BASE" --head "$HEAD"
